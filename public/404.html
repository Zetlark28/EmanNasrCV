<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagina non trovata – Dott.ssa Eman Nasr</title>
    <meta name="robots" content="noindex" />
    <style>
      :root { --primary: #d6317a; --primary-light: #ffedf6; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Segoe UI', sans-serif; background: var(--primary-light); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
      .card { background: #fff; border-radius: 12px; padding: 60px 40px; text-align: center; max-width: 460px; width: 100%; box-shadow: 0 4px 20px rgba(214,49,122,0.13); }
      h1 { font-size: 5rem; color: var(--primary); font-weight: 800; line-height: 1; }
      h2 { font-size: 1.4rem; color: #1a1a1a; margin: 12px 0 16px; }
      p { color: #555; margin-bottom: 32px; line-height: 1.6; }
      a { display: inline-flex; align-items: center; gap: 8px; background: var(--primary); color: #fff; padding: 12px 28px; border-radius: 6px; text-decoration: none; font-weight: 600; transition: background 0.2s; }
      a:hover { background: #b02464; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>404</h1>
      <h2>Pagina non trovata</h2>
      <p>La pagina che stai cercando non esiste o è stata spostata.</p>
      <a href="/">&#8592; Torna alla home</a>
    </div>
  </body>
</html>
